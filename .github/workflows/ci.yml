name: ci

# Headless Blender 5.2 on CPU: unit tests, the full five-stage example at draft quality
# (compared against the committed reference reports), and a pixel-exact read-back of the
# paintover PSD/ORA. Checkpoint images and the paintover kit are uploaded as artifacts.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BLENDER_VERSION: "5.2.2"
      # blender.org sits behind a bot challenge for scripted downloads; use an official mirror + checksum
      BLENDER_URL: https://mirrors.ocf.berkeley.edu/blender/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
      BLENDER_SHA256: 84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168
      BLENDER: /home/runner/blender/blender
      IA_DEVICE: CPU
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for headless Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libsm6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libx11-6 libxext6 libgl1 libegl1

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender (checksum-verified)
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o blender.tar.xz "$BLENDER_URL"
          echo "$BLENDER_SHA256  blender.tar.xz" | sha256sum -c -
          mkdir -p ~/blender
          tar -xJf blender.tar.xz -C ~/blender --strip-components=1

      - name: Versions
        run: $BLENDER --version | head -1

      - name: Syntax
        run: python -m py_compile ia/*.py tools/*.py tests/*.py scenes/*/scene.py

      - name: Test — every ia module imports in Blender
        run: $BLENDER --background --factory-startup --python-exit-code 1 --python tests/test_import.py

      - name: Test — asset import round-trip (FBX / OBJ / GLB)
        run: $BLENDER --background --factory-startup --python-exit-code 1 --python tests/test_assets_roundtrip.py

      - name: Example — all five stages, draft, compared with the reference
        run: python tools/run.py scenes/rooftop_city --quality draft --device CPU --compare scenes/rooftop_city/reference

      - name: Paintover kit read-back (psd-tools)
        run: |
          pip install --quiet psd-tools pillow numpy
          python tools/verify_paintover.py out/rooftop_city/paintover/Cam_Main
          python tools/verify_paintover.py out/rooftop_city/paintover/Cam_Wide

      - name: Upload checkpoints, reports and paintover kit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rooftop_city-${{ github.sha }}
          path: |
            out/rooftop_city/checkpoints/*.png
            out/rooftop_city/reports/
            out/rooftop_city/paintover/
            out/rooftop_city/logs/
